<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebras | Live</title>
  <meta name="description" content="Live session editor with productivity tools." />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<header class="navbar">
  <div class="container nav-container">
    <div class="logo"><a href="/dashboard">Nebras</a></div>
    <nav class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/upload">Upload</a>
      <a href="/sessions">Sessions</a>
      <button id="logoutBtn" class="btn-outline" type="button">Logout</button>
    </nav>
  </div>
</header>

<main class="tool-page">
  <div class="container">

    <section class="page-header">
      <h1>Live Session</h1>
      <p class="muted">Edit text, search, replace, highlight, save drafts, and manage sessions.</p>
    </section>

    <section class="tool-panel">

      <!-- Status -->
      <div class="status-bar">
        <span>Status:</span>
        <span id="statusPill">Ready</span>
        <span id="autosavePill"></span>
      </div>

      <!-- Recording -->
      <div>
        <button id="startRecBtn" type="button">Start Recording</button>
        <button id="stopRecBtn" type="button" disabled>Stop Recording</button>
        <button id="clearAudioBtn" type="button">Clear Audio</button>
        <span id="recTimer">00:00</span>
      </div>

      <!-- Tools -->
      <div>
        <button id="fontMinusBtn">A-</button>
        <button id="fontPlusBtn">A+</button>

        <select id="fontFamilySelect">
          <option value="sans">Sans</option>
          <option value="serif">Serif</option>
          <option value="mono">Mono</option>
        </select>

        <button id="alignLeftBtn">Left</button>
        <button id="alignCenterBtn">Center</button>
        <button id="alignRightBtn">Right</button>

        <button id="readingModeBtn">Reading Mode</button>
      </div>

      <!-- Highlight -->
      <div>
        <select id="highlightSelect">
          <option value="hl-yellow">Yellow</option>
          <option value="hl-blue">Blue</option>
          <option value="hl-green">Green</option>
          <option value="hl-pink">Pink</option>
        </select>

        <button id="applyHighlightBtn">Highlight</button>
        <button id="cleanBtn">Clean</button>
        <button id="copyBtn">Copy</button>
        <button id="saveDraftBtn">Save Draft</button>
        <button id="clearTextBtn">Clear</button>
      </div>

      <!-- Find / Replace -->
      <div>
        <input id="findInput" type="text" placeholder="Find...">
        <button id="findBtn">Find</button>
        <button id="findNextBtn">Next</button>
        <button id="clearFindBtn">Clear</button>

        <input id="replaceInput" type="text" placeholder="Replace...">
        <button id="replaceOneBtn">Replace</button>
        <button id="replaceAllBtn">Replace All</button>
      </div>

      <!-- Translation (مرة واحدة فقط) -->
      <div>
        <select id="translateLang">
          <option value="en">English</option>
          <option value="ar">Arabic</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="tr">Turkish</option>
        </select>

        <button id="translateBtn" type="button">Translate</button>
        <button id="clearTranslateBtn" type="button">Hide Translation</button>
        <button id="restoreOriginalBtn" type="button">Original</button>
      </div>

      <!-- Editors -->
      <div>
        <label>Original Text</label>
        <div id="editor" contenteditable="true"></div>
      </div>

      <div id="translateBox">
        <label>Translation</label>
        <div id="translatedEditor"></div>
      </div>

      <!-- Counts -->
      <div>
        <span id="wordCount">Words: 0</span>
        <span id="charCount">Chars: 0</span>
      </div>

      <!-- Session -->
      <div>
        <input id="sessionTitle" type="text" placeholder="Session title (optional)">
        <button id="saveSessionBtn" type="button">Save Session</button>
      </div>

      <div id="messageBox"></div>
      <div id="audioInfo"></div>

    </section>
  </div>
</main>

<footer>
  <p>© <span id="year"></span> Nebras. All rights reserved.</p>
</footer>

<script src="js/main.js" defer></script>
<script src="js/live.js" defer></script>

</body>
</html>
