<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebras | Upload</title>
  <meta name="description" content="Upload audio and work with transcripts.">
</head>

<body>

<header>
  <div>
    <div><a href="/dashboard">Nebras</a></div>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/live">Live</a>
      <a href="/sessions">Sessions</a>
      <button id="logoutBtn" type="button">Logout</button>
    </nav>
  </div>
</header>

<main>

  <section>
    <h1>Upload Session</h1>
    <p>Upload audio, then edit and save your transcript session.</p>
  </section>

  <section>

    <!-- Status -->
    <div>
      <span>Status:</span>
      <span id="statusPill">Ready</span>
      <span id="autosavePill"></span>
    </div>

    <!-- Upload -->
    <div>
      <input id="audioFileInput" type="file" accept="audio/*">
      <button id="clearAudioBtn" type="button">Clear Audio</button>
    </div>

    <div id="audioInfo"></div>

    <div>
      <audio id="audioPlayer" controls></audio>
    </div>

    <!-- Tools -->
    <div>
      <button id="fontMinusBtn">A-</button>
      <button id="fontPlusBtn">A+</button>

      <select id="fontFamilySelect">
        <option value="sans">Sans</option>
        <option value="serif">Serif</option>
        <option value="mono">Mono</option>
      </select>

      <button id="alignLeftBtn">Left</button>
      <button id="alignCenterBtn">Center</button>
      <button id="alignRightBtn">Right</button>

      <button id="readingModeBtn">Reading Mode</button>
    </div>

    <!-- Highlight -->
    <div>
      <select id="highlightSelect">
        <option value="hl-yellow">Yellow</option>
        <option value="hl-blue">Blue</option>
        <option value="hl-green">Green</option>
        <option value="hl-pink">Pink</option>
      </select>

      <button id="applyHighlightBtn">Apply Highlight</button>
      <button id="cleanBtn">Clean Text</button>
      <button id="copyBtn">Copy All</button>
      <button id="saveDraftBtn">Save Draft</button>
      <button id="clearTextBtn">Clear Text</button>
    </div>

    <!-- Find / Replace -->
    <div>
      <input id="findInput" type="text" placeholder="Find...">
      <button id="findBtn">Find</button>
      <button id="findNextBtn">Next</button>
      <button id="clearFindBtn">Clear</button>

      <input id="replaceInput" type="text" placeholder="Replace...">
      <button id="replaceOneBtn">Replace One</button>
      <button id="replaceAllBtn">Replace All</button>
    </div>
    <!-- Translation -->
     <!-- Translation -->
<div>
  <select id="translateLang">
    <option value="en">English</option>
    <option value="ar">Arabic</option>
    <option value="fr">French</option>
    <option value="es">Spanish</option>
    <option value="de">German</option>
    <option value="tr">Turkish</option>
  </select>

  <button id="translateBtn" type="button">Translate</button>
  <button id="clearTranslateBtn" type="button">Hide Translation</button>
  <button id="restoreOriginalBtn" type="button">Original</button>
</div>

<!-- Editor -->
<div>
  <label>Original Text</label>
  <div id="editor" contenteditable="true"></div>
</div>

<!-- Translation Output -->
<div id="translateBox" style="display:none">
  <label>Translation</label>
  <div id="translatedEditor"></div>
</div>

      <!-- Counts -->
      <div>
        <span id="wordCount">Words: 0</span>
        <span id="charCount">Chars: 0</span>
      </div>

      <!-- Session -->
      <div>
        <input id="sessionTitle" type="text" placeholder="Session title (optional)">
        <button id="saveSessionBtn" type="button">Save Session</button>
      </div>

      <div id="messageBox"></div>
      <div id="audioInfo"></div>

    </section>
  </div>
</main>
<footer>
  <p>© 2026 Nebras. All rights reserved.</p>
</footer>

<script src="js/main.js"></script>
<script src="js/upload.js"></script>

</body>
</html>
