<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebras | Upload</title>
  <meta name="description" content="Upload audio and work with transcripts.">
</head>

<body>

<header>
  <div>
    <div><a href="/dashboard">Nebras</a></div>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/live">Live</a>
      <a href="/sessions">Sessions</a>
      <button id="logoutBtn" type="button">Logout</button>
    </nav>
  </div>
</header>

<main>
  <div>

    <section>
      <h1>Upload Session</h1>
      <p>Upload audio, then edit and save your transcript session.</p>
    </section>

    <section>

      <div>
        <span>Status:</span>
        <span id="statusPill">Ready</span>
        <span id="autosavePill"></span>
      </div>

    
      <div>
        <input id="audioFileInput" type="file" accept="audio/*">
        <button id="clearAudioBtn" type="button">Clear Audio</button>
      </div>

      <div id="audioInfo"></div>

      <div>
        <audio id="audioPlayer" controls></audio>
      </div>

    
      <div>
        <button id="fontMinusBtn">A-</button>
        <button id="fontPlusBtn">A+</button>

        <select id="fontFamilySelect">
          <option value="sans">Sans</option>
          <option value="serif">Serif</option>
          <option value="mono">Mono</option>
        </select>

        <button id="alignLeftBtn">Left</button>
        <button id="alignCenterBtn">Center</button>
        <button id="alignRightBtn">Right</button>

        <button id="readingModeBtn">Reading Mode</button>
      </div>

      <div>
        <select id="highlightSelect">
          <option value="hl-yellow">Highlight Yellow</option>
          <option value="hl-blue">Highlight Blue</option>
          <option value="hl-green">Highlight Green</option>
          <option value="hl-pink">Highlight Pink</option>
        </select>

        <button id="applyHighlightBtn">Apply Highlight</button>
        <button id="cleanBtn">Clean Text</button>
        <button id="copyBtn">Copy All</button>
        <button id="saveDraftBtn">Save Draft</button>
        <button id="clearTextBtn">Clear Text</button>
      </div>

      <div>
        <input id="findInput" type="text" placeholder="Find...">
        <button id="findBtn">Find</button>
        <button id="findNextBtn">Find Next</button>
        <button id="clearFindBtn">Clear Find</button>

        <input id="replaceInput" type="text" placeholder="Replace with...">
        <button id="replaceOneBtn">Replace One</button>
        <button id="replaceAllBtn">Replace All</button>
      </div>

      <div>
        <select id="translateLang">
          <option value="en">Translate to English</option>
          <option value="ar">Translate to Arabic</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="tr">Turkish</option>
        </select>

        <button id="translateBtn">Translate</button>
        <button id="clearTranslateBtn" style="display:none">Hide</button>
      </div>

     
      <div>
        <div>
          <label>Original Text</label>
          <div id="editor" contenteditable="true"></div>
        </div>

        <div id="translateBox" style="display:none">
          <label>Translation</label>
          <div id="translatedEditor"></div>
        </div>
      </div>

      <div>
        <span id="wordCount">Words: 0</span>
        <span id="charCount">Chars: 0</span>
      </div>

      <div>
        <input id="sessionTitle" type="text" placeholder="Session title">
        <button id="saveSessionBtn">Save Session</button>
      </div>

      <div id="messageBox"></div>

    </section>

  </div>
</main>

<footer>
  <p>© 2026 Nebras. All rights reserved.</p>
</footer>

<script src="js/main.js"></script>
<script src="js/upload.js"></script>

</body>
</html>
